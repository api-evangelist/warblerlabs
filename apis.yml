    Public GraphQL subgraph that indexes useful state about the Goldfinch
    Protocol (senior pool, tranched pools, backers, borrowers, staked positions,
    membership) for use by the Goldfinch Interface and any third party. Served
    over The Graph / Goldsky. Read-only, no authentication required.
