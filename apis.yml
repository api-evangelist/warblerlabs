name: Warblerlabs
description: >-
  Warbler Labs is a San Francisco fintech and blockchain company (founded 2020
  by Blake West and Michael Sall) that builds and contributes to the Goldfinch
  Protocol, a decentralized credit protocol for real-world asset lending that
  provides stablecoin loans and yield generated by off-chain economic activity,
  and UID (Unique Identity), a KYC/KYB-compliant on-chain identity NFT. The
  public developer surface is the Goldfinch smart-contract system on Ethereum,
  an open-source monorepo (github.com/goldfinch-eng), a hosted GraphQL subgraph
  that indexes protocol state, and developer documentation at dev.goldfinch.finance.
  Security is central: every release is audited by external firms (CertiK, Trail
  of Bits) and the protocol runs a $500k Immunefi bug bounty.
